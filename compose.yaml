services:
  bot:
    build: .
    container_name: neonhost-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./caddy/sites:/app/caddy/sites
      - ./vps-image:/app/vps-image:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - caddy
    networks:
      - hosting
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/sites:/etc/caddy/sites:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - hosting
networks:
  hosting:
    name: hosting
    driver: bridge
volumes:
  caddy_data:
  caddy_config:
