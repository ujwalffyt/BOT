name: Validate NeonHost

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bot dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python
        run: python -m py_compile bot.py
      - name: Check shell scripts
        run: bash -n deploy.sh vps-image/entrypoint.sh
      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Build bot and SSH container images
        run: |
          docker build -t neonhost-bot:ci .
          docker build -t neonhost-vps:ci ./vps-image
