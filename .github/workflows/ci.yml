name: Validate NeonHost

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bot dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python
        run: python -m py_compile bot.py
      - name: Smoke-test Discord command registration
        env:
          DISCORD_BOT_TOKEN: ci-placeholder-token
          ADMIN_IDS: "123456789"
          PUBLIC_HOST: 127.0.0.1
          DB_PATH: .ci/hosting.sqlite3
          WORK_DIR: .ci/work
          SITES_DIR: .ci/sites
        run: |
          mkdir -p .ci
          python -c "import bot; commands = bot.bot.tree.get_commands(); [command.to_dict() for command in commands]; print('Registered slash commands:', ', '.join(command.name for command in commands))"
      - name: Check shell scripts
        run: bash -n deploy.sh vps-image/entrypoint.sh
      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Build Discord bot image
        run: docker build -t neonhost-bot:ci .
      - name: Build Ubuntu 24.04 VPS image
        run: docker build --build-arg BASE_IMAGE=ubuntu:24.04 -t neonhost-vps:ubuntu-ci ./vps-image
      - name: Build Debian 12 VPS image
        run: docker build --build-arg BASE_IMAGE=debian:12-slim -t neonhost-vps:debian-ci ./vps-image
      - name: Build Alpine 3.22 VPS image
        run: docker build --build-arg BASE_IMAGE=alpine:3.22 -t neonhost-vps:alpine-ci ./vps-image
